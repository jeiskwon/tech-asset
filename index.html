    const cardEls = [];

    function updateStack() {
      const remainRatio = Math.max(0, (needPicks - pickedCount) / needPicks);
      const layers = Math.ceil(STACK_LAYERS_MAX * remainRatio);
      if (layers <= 0) {
        stackEl.style.boxShadow = "none";
        stackEl.style.opacity = "0";
        return;
      }
      const shadows = [];
      for (let i = 1; i <= layers; i++) {
        shadows.push(`0 ${i * 3}px 0 -1px rgba(107, 91, 149, ${0.35 - i * 0.03})`);
      }
      stackEl.style.boxShadow = shadows.join(", ");
      stackEl.style.opacity = "1";
    }

    for (let i = 0; i < DECK_SIZE; i++) {
      const c = document.createElement("div");
      c.className = "tarot-pick-card";
      c.style.backgroundImage = `url('${IMG.back}')`;
      deckEl.appendChild(c);
      cardEls.push(c);
    }
    updateStack();

    function layoutFan() {
      const mid = (DECK_SIZE - 1) / 2;
      cardEls.forEach((c, i) => {
        const offset = i - mid;
        c.style.transform = `translateX(${offset * offsetStep}px) rotate(${offset * 8}deg)`;
        c.style.zIndex = 100 - Math.abs(offset);
      });
    }

    function layoutShuffleFrame() {
      cardEls.forEach((c) => {
        const x = (Math.random() - 0.5) * 34;
        const y = Math.random() * 8;
        const rot = (Math.random() - 0.5) * 22;
        c.style.transform = `translateX(${x}px) translateY(${y}px) rotate(${rot}deg)`;
      });
    }

    layoutFan();
    let shuffleFrames = 0;
    const shuffleTimer = setInterval(() => {
      layoutShuffleFrame();
      shuffleFrames++;
      if (shuffleFrames >= 5) {
        clearInterval(shuffleTimer);
        layoutFan();
        hintEl.textContent = needPicks === 1
          ? "마음에 드는 카드를 한 장 골라 탭하세요"
          : `마음에 드는 카드를 ${needPicks}장 골라 탭하세요`;
        progressEl.textContent = needPicks > 1 ? `0 / ${needPicks}` : "";
        cardEls.forEach((c) => {
          c.addEventListener("click", onPick);
        });
      }
    }, 260);

    function onPick(e) {
      const c = e.currentTarget;
      c.removeEventListener("click", onPick);
      c.style.pointerEvents = "none";
      c.style.zIndex = 200;
      c.style.transform += " translateY(-16px) scale(1.1)";
      setTimeout(() => {
        c.style.opacity = "0";
      }, 150);

      pickedCount++;
      updateStack();
      if (pickedCount < needPicks) {
        progressEl.textContent = `${pickedCount} / ${needPicks}`;
      } else {
        hintEl.textContent = "카드를 확인하고 있어요...";
        progressEl.textContent = "";
        setTimeout(() => {
          if (state.spread === "one") {
            const d = drawCards(1)[0];
            renderResultOne(d.card, d.reversed);
          } else if (state.spread === "three") {
            renderResultMulti(drawCards(3), POSITIONS_3, "3장 스프레드");
          } else {
            renderResultMulti(drawCards(10), POSITIONS_10, "켈틱 크로스");
          }
        }, 500);
      }
    }
  }

  // ============================================================
  // 4. 카드 뽑기 + 해석 유틸
  // ============================================================
  function drawCards(n) {
    const pool = CARDS.slice();
    const picked = [];
    for (let i = 0; i < n; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      const card = pool.splice(idx, 1)[0];
      picked.push({ card: card, reversed: Math.random() < 0.5 });
    }
    return picked;
  }

  // 카드 + 방향 + 현재 선택된 카테고리를 조합해 해석을 만든다
  function getInterpretation(card, reversed) {
    const theme = reversed ? card.tr : card.tu;
    const general = reversed ? card.reversed : card.upright;
    const detail = reversed ? card.reversedDetail : card.uprightDetail;
    if (state.category === "today") return { general: general, detail: detail, extra: null };
    const extra = (THEME_CATEGORY[theme] && THEME_CATEGORY[theme][state.category]) || null;
    return { general: general, detail: detail, extra: extra };
  }

  // ============================================================
  // 5-1. 결과 - 1장 뽑기
  // ============================================================
  function renderResultOne(card, reversed) {
    const { general, detail, extra } = getInterpretation(card, reversed);
    const orientationLabel = reversed ? "역방향" : "정방향";
    const catLabel = CATEGORY_LABELS[state.category];

    root.innerHTML = `
      <div class="tarot-card" style="background: linear-gradient(160deg, #6b5b9522, #ffffff);">
        <div class="tarot-result-frame">
          <div class="card-wrap">
            <img class="card-face ${reversed ? 'reversed' : ''}" src="${card.img}" alt="${card.name}" />
          </div>
          <img class="frame" src="${IMG.frameResult}" alt="" />
          <img class="tarot-badge" src="${IMG.badgeResult}" alt="" />
        </div>
        <div class="tarot-orientation-tag">${orientationLabel}</div>
        <div class="tarot-card-name">${card.name}</div>

        <div class="tarot-nickname-tag">${state.nickname}님의 ${catLabel} 카드는<br/><b>[${card.name}]</b> ${orientationLabel}이에요</div>

        <div class="tarot-interp">
          <span class="interp-label">${orientationLabel} 핵심 해석</span><br/>
          ${general}
          ${detail ? `<div class="tarot-interp-detail">${detail}</div>` : ''}
          ${extra ? `<div class="tarot-interp-extra"><b>[${catLabel}]</b> ${extra}</div>` : ''}
        </div>

        <button class="tarot-btn tarot-btn-full" id="tarot-retry-btn">
          <img src="${IMG.refreshIcon}" alt="" style="width:20px;height:20px;" /> 다시 뽑기
        </button>
        <button class="tarot-btn-outline" id="tarot-share-btn" style="width:100%;">
          <img src="${IMG.shareIcon}" alt="" /> 결과 공유하기
        </button>
      </div>
    `;

    document.getElementById("tarot-retry-btn").onclick = () => renderCategory();
    document.getElementById("tarot-share-btn").onclick = () => {
      shareToKakao({
        title: `${state.nickname}님의 ${catLabel} 카드는 [${card.name}] ${orientationLabel}`,
        description: `${general}${extra ? " " + extra : ""}`,
        imageUrl: card.img
      });
    };
  }

  // ============================================================
  // 5-2. 결과 - 3장 스프레드 / 켈틱 크로스 (공통)
  // ============================================================
  function renderResultMulti(draws, positions, spreadTitle) {
    const catLabel = CATEGORY_LABELS[state.category];

    const blocksHtml = draws.map((d, i) => {
      const pos = positions[i];
      const { general, detail, extra } = getInterpretation(d.card, d.reversed);
      const orientationLabel = d.reversed ? "역방향" : "정방향";
      return `
        <div class="tarot-pos-block">
          <div class="tarot-pos-header">
            <span class="tarot-pos-num">${i + 1}</span>
            <div>
              <div class="tarot-pos-label">${pos.label}</div>
              <div class="tarot-pos-desc">${pos.desc}</div>
            </div>
          </div>
          <div class="tarot-pos-body">
            <div class="tarot-pos-thumb">
              <img class="${d.reversed ? 'reversed' : ''}" src="${d.card.img}" alt="${d.card.name}" />
            </div>
            <div class="tarot-pos-text">
              <div class="tarot-pos-cardname">${d.card.name} <span class="tarot-orientation-mini">${orientationLabel}</span></div>
              <div class="tarot-pos-meaning">${general}</div>
              ${detail ? `<div class="tarot-pos-detail">${detail}</div>` : ''}
              ${extra ? `<div class="tarot-pos-extra"><b>[${catLabel}]</b> ${extra}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join("");

    root.innerHTML = `
      <div class="tarot-card" style="background: linear-gradient(160deg, #6b5b9522, #ffffff);">
        <div class="tarot-title">🔮 ${spreadTitle} 결과</div>
        <div class="tarot-sub">${state.nickname}님을 위한 ${catLabel} 리딩이에요</div>
        ${blocksHtml}
        <button class="tarot-btn tarot-btn-full" id="tarot-retry-btn">
          <img src="${IMG.refreshIcon}" alt="" style="width:20px;height:20px;" /> 다시 뽑기
        </button>
        <button class="tarot-btn-outline" id="tarot-share-btn" style="width:100%;">
          <img src="${IMG.shareIcon}" alt="" /> 결과 공유하기
        </button>
      </div>
    `;

    document.getElementById("tarot-retry-btn").onclick = () => renderCategory();
    document.getElementById("tarot-share-btn").onclick = () => {
      const repIdx = getRepresentativeIndex(positions);
      const rep = draws[repIdx];
      shareToKakao({
        title: `${state.nickname}님의 ${catLabel} ${spreadTitle} 결과`,
        description: `${buildMultiSummaryText(draws, positions)} · 전체 해석은 아래에서 확인하세요!`,
        imageUrl: rep.card.img
      });
    };
  }

  renderStart();
})();
</script>

    <script>
      function sendHeightToParent() {
        var contentHeight = Math.max(
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
          document.documentElement.offsetHeight,
          document.body.offsetHeight,
          600
        );
        window.parent.postMessage({ type: 'resizeTarotIframe', height: contentHeight }, '*');
      }

      window.addEventListener('load', sendHeightToParent);
      window.addEventListener('resize', sendHeightToParent);

      if (window.ResizeObserver) {
        var observer = new ResizeObserver(function() {
          sendHeightToParent();
        });
        observer.observe(document.body);
      }

      setTimeout(sendHeightToParent, 300);
      setTimeout(sendHeightToParent, 1000);
    </script>
  </body>
</html>
